---
# Every 2 minutes: if cni0 exists and flannel.1 does not (3 minutes after the k3s service started),
# restart the k3s service. Alert FlannelTunnelMissing reports it on Discord after 10 minutes.

- name: Install the flannel tunnel watchdog
  ansible.builtin.copy:
    src: flannel-watchdog.sh
    dest: /usr/local/sbin/flannel-watchdog
    owner: root
    group: root
    mode: "0755"

- name: Install the flannel watchdog service
  ansible.builtin.template:
    src: flannel-watchdog.service.j2
    dest: /etc/systemd/system/flannel-watchdog.service
    owner: root
    group: root
    mode: "0644"
  register: flannel_watchdog_service_unit

- name: Install the flannel watchdog timer
  ansible.builtin.copy:
    src: flannel-watchdog.timer
    dest: /etc/systemd/system/flannel-watchdog.timer
    owner: root
    group: root
    mode: "0644"
  register: flannel_watchdog_timer_unit

- name: Enable the flannel watchdog timer
  ansible.builtin.systemd_service:
    name: flannel-watchdog.timer
    enabled: true
    state: started
    daemon_reload: "{{ flannel_watchdog_service_unit is changed or flannel_watchdog_timer_unit is changed }}"
  # In --check the unit files are not written yet, so there is nothing to enable.
  when: not (ansible_check_mode and (flannel_watchdog_service_unit is changed or flannel_watchdog_timer_unit is changed))
