---
- name: Check required variables
  ansible.builtin.assert:
    that:
      - k3s_version | length > 0
      - k3s_node_external_ip | length > 0
      - tailscale_ip is defined
    fail_msg: k3s_version, k3s_node_external_ip and tailscale_ip (tailscale role) must be set.
    quiet: true

- name: Create the k3s config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - /etc/rancher/k3s/config.yaml.d

- name: Write the base k3s server config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      # Managed by Ansible (roles/k3s_server). Edit inventory/group_vars/k3s_server.yml instead.
      {{ k3s_server_config | to_nice_yaml(indent=2) }}
    owner: root
    group: root
    mode: "0600"
    backup: true
  notify: Restart k3s

- name: Write the Tailscale networking drop-in
  ansible.builtin.template:
    src: 10-tailscale.yaml.j2
    dest: /etc/rancher/k3s/config.yaml.d/10-tailscale.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false
  check_mode: false   # read-only, must run in --check too

- name: Install or upgrade k3s server {{ k3s_version }}
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -sfL https://get.k3s.io | sh -s - server
    executable: /bin/bash
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout
  changed_when: true

- name: Make sure k3s is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started

- name: Apply pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Wait for the API server to be ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: k3s_readyz
  until: k3s_readyz.rc == 0
  retries: 36
  delay: 5
  changed_when: false

- name: Restrict ServiceLB to the control plane
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl label nodes -l node-role.kubernetes.io/control-plane
    svccontroller.k3s.cattle.io/enablelb=true --overwrite
  register: k3s_lb_label
  changed_when: "' labeled' in k3s_lb_label.stdout"
  when: k3s_servicelb_on_server_only
