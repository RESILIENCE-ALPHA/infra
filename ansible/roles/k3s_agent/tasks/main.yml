---
- name: Check required variables
  ansible.builtin.assert:
    that:
      - k3s_version | length > 0
      - tailscale_ip is defined
    fail_msg: k3s_version and tailscale_ip (tailscale role) must be set.
    quiet: true

- name: Check that systemd is running (on WSL, set systemd=true in /etc/wsl.conf)
  ansible.builtin.stat:
    path: /run/systemd/system
  register: k3s_agent_systemd
  failed_when: not k3s_agent_systemd.stat.exists

# Read from the server directly, so `--limit k3s_agents` works on its own.
- name: Read the server's Tailscale IP
  ansible.builtin.command: tailscale ip -4
  delegate_to: "{{ k3s_server_host }}"
  run_once: true
  register: k3s_server_ts_ip
  changed_when: false
  check_mode: false   # read-only, must run in --check too

- name: Read the cluster join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  delegate_to: "{{ k3s_server_host }}"
  run_once: true
  become: true
  register: k3s_node_token
  no_log: true

- name: Create the k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the k3s agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  vars:
    k3s_server_url: "https://{{ k3s_server_ts_ip.stdout_lines | first }}:6443"
    k3s_token: "{{ k3s_node_token.content | b64decode | trim }}"
  no_log: true
  notify: Restart k3s-agent

- name: Read the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false
  check_mode: false   # read-only, must run in --check too

- name: Install or upgrade k3s agent {{ k3s_version }}
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -sfL https://get.k3s.io | sh -s - agent
    executable: /bin/bash
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ k3s_server_ts_ip.stdout_lines | first }}:6443"
    K3S_TOKEN: "{{ k3s_node_token.content | b64decode | trim }}"
  when: k3s_installed.rc != 0 or k3s_version not in k3s_installed.stdout
  changed_when: true
  no_log: true

- name: Make sure k3s-agent is enabled and running
  ansible.builtin.systemd_service:
    name: k3s-agent
    enabled: true
    state: started

- name: Apply pending restarts now
  ansible.builtin.meta: flush_handlers

- name: Wait for the node to be Ready
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl wait --for=condition=Ready node/{{ k3s_node_name }} --timeout=10s
  delegate_to: "{{ k3s_server_host }}"
  become: true
  register: k3s_agent_ready
  until: k3s_agent_ready.rc == 0
  retries: 18
  delay: 10
  changed_when: false
