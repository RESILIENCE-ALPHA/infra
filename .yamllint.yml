# yamllint config for CI (.github/workflows/lint.yml).
extends: default

ignore: |
  kubernetes/apisix/crds/apisixic-crds.yaml
  ansible/.ansible/
  .ansible/

rules:
  line-length:
    max: 140
  document-start: disable          # Kubernetes and Helm files rarely start with ---
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    check-keys: false              # GitHub Actions "on:" key
  braces:
    max-spaces-inside: 1
  indentation:
    indent-sequences: whatever
