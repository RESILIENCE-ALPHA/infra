# nginx server for the docs site (nginx-unprivileged listens on 8080 as user 101).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Always revalidate: a new version must show up right after the rollout.
    expires -1;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Scripts from this site only, plus Mermaid (diagrams in the Markdown pages) from jsDelivr.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ \.md$ {
        default_type "text/markdown; charset=utf-8";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
