# Documentation site (gitops/apps/docs-site.yaml): static files served by nginx, on the tailnet only
# (https://docs.taild095e0.ts.net, Ingress in kubernetes/tailscale/access/admin-ingresses.yaml).
# The files in site/ become a ConfigMap; its name carries a hash of the content, so any change in Git
# rolls the pod. Pages: site/*.md (one per tab). Diagram: site/schema.js (views, scenarios). Open a PR.
# Preview locally: cd kubernetes/docs-site/site && python3 -m http.server 8000
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: admin
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: docs-site-content
    files:
      - site/index.html
      - site/style.css
      - site/app.js
      - site/schema.js
      - site/marked.min.js         # marked 15.0.12 (MIT), Markdown renderer
      - site/how-it-works.md
      - site/install.md
      - site/teams.md
      - site/new-feature.md
      - site/operations.md
  - name: docs-site-nginx
    files:
      - default.conf=nginx.conf
