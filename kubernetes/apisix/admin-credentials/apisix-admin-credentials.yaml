# APISIX admin API keys, from Vault apps/apisix-admin (fields `key` and `viewer`).
# Read by the apisix chart (apisix.admin.credentials.secretName) and by the ingress
# controller's GatewayProxy (adminKey.valueFrom). Wave -1: exists before the chart's pods.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apisix-admin-credentials
  namespace: apisix
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: apisix-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin
      remoteRef:
        key: apisix-admin
        property: key
    - secretKey: viewer
      remoteRef:
        key: apisix-admin
        property: viewer
