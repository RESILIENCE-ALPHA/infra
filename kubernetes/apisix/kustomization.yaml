# Gateway configuration, synced by Argo CD (gitops/apps/apisix-config.yaml).
# Helm values in this folder are read by the apisix / apisix-ingress-controller apps;
# admin-credentials/ belongs to the apisix app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - gateway.yaml
  - certificates.yaml
  - http-to-https-redirect.yaml
  - tracing.yaml
  - referencegrant.yaml
