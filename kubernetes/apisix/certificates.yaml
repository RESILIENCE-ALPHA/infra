  name: vault-tls
  namespace: apisix
spec:
  secretName: vault-tls
  dnsNames: [vault-ui.karim-portfolio.xyz]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apisix-dashboard-tls
  namespace: apisix
spec:
  secretName: apisix-dashboard-tls
  dnsNames: [apisix-dashboard.karim-portfolio.xyz]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-tls
  namespace: apisix
