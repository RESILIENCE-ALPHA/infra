# TLS certificates for the public gateway listeners (secrets live in the gateway's namespace).
# All certificates are issued by the production Let's Encrypt ClusterIssuer (letsencrypt-prod).
# Admin tools have no public certificate: they are on the tailnet (kubernetes/tailscale/access).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-tls
  namespace: apisix
spec:
  secretName: auth-tls
  dnsNames: [auth.karim-portfolio.xyz]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payment-tls
  namespace: apisix
spec:
  secretName: payment-tls
  dnsNames: [payment.karim-portfolio.xyz]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-tls
  namespace: apisix
spec:
  secretName: app-tls
  dnsNames: [app.karim-portfolio.xyz]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
