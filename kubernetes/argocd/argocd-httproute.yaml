# Argo CD UI at argocd.karim-portfolio.xyz (TLS ends at the gateway, listener https-argocd).
# Gateway API defaults written out so Argo CD sees no drift on its own route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: apisix
  hostnames:
    - argocd.karim-portfolio.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
