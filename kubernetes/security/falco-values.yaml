# Falco (chart falcosecurity/falco 9.2.1), synced by Argo CD (gitops/apps/falco.yaml).
# Alerts go through falcosidekick to service-ia (ia namespace) for remediation.
driver:
  type: modern_ebpf

json_output: true

# 1Gi was hit by the alert feedback loop below (OOM-killed 2026-10-22, node stalled).
resources:
  requests: {cpu: 100m, memory: 512Mi}
  limits: {cpu: 1000m, memory: 1536Mi}

customRules:
  custom-rules.yaml: |
    # Watches the secrets platform (namespace security: Vault, External Secrets, cert-manager).
    # Only OUTBOUND connections from processes that are not expected there. Falco itself runs in
    # security-apps, so its own traffic never matches (an alert loop OOM-killed Falco in October).
    # Expected: Vault; External Secrets -> Vault + API server; cert-manager (controller,
    # cainjector, webhook, startupapicheck hook) -> API server + Let's Encrypt.
    - rule: Unexpected Outbound Connection In Security Namespace
      desc: Outbound network connection from an unexpected process in the security namespace
      condition: >
        outbound and k8s.ns.name = "security"
        and not proc.name in (vault, vault-k8s, external-secrets, controller, cainjector, webhook, startupapicheck)
      output: "Outbound connection in security namespace (user=%user.name command=%proc.cmdline connection=%fd.name pod=%k8s.pod.name)"
      priority: NOTICE
      tags: [network, k8s]

falcosidekick:
  enabled: true
  config:
    webhook:
      address: http://service-ia.ia.svc.cluster.local:5000/remediate
      minimumpriority: notice
