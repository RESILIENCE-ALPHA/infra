# Nightly backup of the k3s datastore (SQLite, /var/lib/rancher/k3s/server/db/state.db) and the
# server token, from the control plane (the VPS) to RustFS: s3://backups/k3s/, kept 90 days.
# Restore: docs/runbooks/backups-restore.md ("k3s datastore").
#
# Not encrypted: the archive holds the server token and every Kubernetes object, Secrets
# included. Anyone who can read it can take over the cluster. Same accepted risk as the Postgres
# dumps (decision of 2026-11-11).
apiVersion: v1
kind: ConfigMap
metadata:
  name: k3s-backup-script
  namespace: backup
data:
  backup.sh: |
    #!/bin/sh
    # sqlite online backup -> integrity check -> tar.gz with the token -> upload -> verify -> prune.
    set -eu
    apk add --no-cache sqlite rclone >/dev/null
    export RCLONE_CONFIG=/dev/null

    stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
    snap=/work/snap
    out="/work/k3s-$stamp.tar.gz"
    dest="rustfs:$BUCKET/k3s"
    mkdir -p "$snap"

    # Online backup API: consistent copy while k3s keeps writing.
    sqlite3 /k3s-db/state.db ".backup '$snap/state.db'"
    check=$(sqlite3 "$snap/state.db" "PRAGMA integrity_check;")
    [ "$check" = "ok" ] || { echo "integrity check failed: $check"; exit 1; }
    cp /k3s-token "$snap/token"
    echo "datastore: $(du -h "$snap/state.db" | cut -f1), $(sqlite3 "$snap/state.db" 'select count(*) from kine;') kine rows"

    tar czf "$out" -C "$snap" state.db token
    rm -rf "$snap"

    rclone mkdir -q "rustfs:$BUCKET"
    rclone copy -q "$out" "$dest/"
    remote_size=$(rclone size -q --json "$dest/$(basename "$out")" | sed -n 's/.*"bytes":\([0-9]*\).*/\1/p')
    local_size=$(stat -c %s "$out")
    [ "$remote_size" = "$local_size" ] || { echo "upload size mismatch: $remote_size != $local_size"; exit 1; }
    echo "uploaded $(basename "$out") ($local_size bytes)"

    rclone delete -q --min-age "$RETENTION" "$dest/"
    echo "kept: $(rclone lsf -q "$dest/" | wc -l) backups"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-backup
  namespace: backup
spec:
  schedule: "45 2 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: k3s-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"     # the datastore lives on the VPS
          containers:
            - name: backup
              image: alpine:3.22
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - name: BUCKET
                  value: backups
                - name: RETENTION
                  value: 90d
                - name: RCLONE_CONFIG_RUSTFS_TYPE
                  value: s3
                - name: RCLONE_CONFIG_RUSTFS_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_RUSTFS_ENDPOINT
                  value: http://rustfs.backup.svc.cluster.local:9000
                - name: RCLONE_CONFIG_RUSTFS_FORCE_PATH_STYLE
                  value: "true"
              envFrom:
                - secretRef:
                    name: backup-target
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
                # Directory mounted read-write only so SQLite can use its WAL/shm files while
                # reading; the script never writes to it.
                - name: k3s-db
                  mountPath: /k3s-db
                - name: k3s-token
                  mountPath: /k3s-token
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: k3s-backup-script
            - name: work
              emptyDir:
                sizeLimit: 2Gi
            - name: k3s-db
              hostPath:
                path: /var/lib/rancher/k3s/server/db
                type: Directory
            - name: k3s-token
              hostPath:
                path: /var/lib/rancher/k3s/server/token
                type: File
