# RustFS root credentials, from Vault apps/backup (keys rustfs_access_key, rustfs_secret_key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
  namespace: backup
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rustfs-credentials
  data:
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: backup      # Vault: apps/backup
        property: rustfs_access_key
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: backup      # Vault: apps/backup
        property: rustfs_secret_key
