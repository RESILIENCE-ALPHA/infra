# RustFS keys for the backup jobs, as rclone environment variables (Vault apps/backup).
# Same template in applications (postgres-backup.yaml) and security (vault-backup.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-target
  namespace: backup
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backup-target
  data:
    - secretKey: RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID
      remoteRef:
        key: backup      # Vault: apps/backup
        property: rustfs_access_key
    - secretKey: RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY
      remoteRef:
        key: backup      # Vault: apps/backup
        property: rustfs_secret_key
