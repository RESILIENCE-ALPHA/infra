# RustFS 1.0 (S3-compatible object storage, Apache-2.0), single node, as the backup target.
# Runs on apps-node (the laptop): the backups live off the VPS, on the laptop's WSL disk.
# Reachable inside the cluster only (Service rustfs.backup:9000, console :9001 by port-forward).
# Objects are age-encrypted by the backup jobs before upload (the laptop disk is not encrypted).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: backup
  annotations:
    # Never deleted by Argo CD: it holds the backups.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path          # created on the node the pod runs on (apps-node)
  resources:
    requests:
      storage: 200Gi                    # not enforced by local-path; documents the expected size
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: backup
  labels:
    app: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate                      # one writer on the volume
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      nodeSelector:
        kubernetes.io/hostname: apps-node
      tolerations:
        - key: location
          operator: Equal
          value: home
          effect: NoSchedule
      securityContext:
        runAsUser: 10001                # the image's rustfs user
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "0.0.0.0:9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
          envFrom:
            - secretRef:
                name: rustfs-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: backup
spec:
  type: ClusterIP
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
