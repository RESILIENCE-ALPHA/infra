# Admin tools on the tailnet only: each Ingress of class "tailscale" gets its own tailnet device
# and a Let's Encrypt certificate from Tailscale: https://<host>.<tailnet>.ts.net
# Reachable only from devices logged in to the tailnet (Mac, dev container, phone with Tailscale).
# There is no public route or DNS record for these tools (removed in 5.6 step 6).
# Argo CD
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tailnet-argocd
  namespace: argocd
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 80
  tls:
    - hosts:
        - argocd
---
