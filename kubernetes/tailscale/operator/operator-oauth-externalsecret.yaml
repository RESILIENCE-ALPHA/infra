# Tailscale OAuth client of the operator (scopes Devices Core, Auth Keys, Services: write; tag
# tag:k8s-operator), from Vault apps/tailscale. Mounted by the chart (oauthSecretVolume).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale      # Vault: apps/tailscale
        property: oauth_client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale      # Vault: apps/tailscale
        property: oauth_client_secret
