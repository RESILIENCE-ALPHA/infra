apiVersion: apps/v1
kind: Deployment
metadata:
  name: epsi-pay-auth
  namespace: applications
  labels:
    app: epsi-pay-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epsi-pay-auth
  template:
    metadata:
      labels:
        app: epsi-pay-auth
    spec:
      serviceAccountName: seed-waiter
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: wait-for-seed
          image: registry.k8s.io/kubectl:v1.35.4
          command: [kubectl, wait, --for=condition=complete, job/epsi-pay-database-seed, --timeout=600s]
      containers:
        - name: auth
          image: ghcr.io/resilience-alpha/epsi-pay-auth:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: host}}
            - name: DB_PORT
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: port}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: database}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: password}}
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: epsi-pay-auth
  namespace: applications
spec:
  type: ClusterIP
  selector:
    app: epsi-pay-auth
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: epsi-pay-auth-route
  namespace: applications
spec:
  parentRefs:
    - name: main-gateway
      namespace: apisix
  hostnames:
    - auth.karim-portfolio.xyz
  rules:
    # Swagger UI and its OpenAPI JSON: basic auth (swagger-basic-auth.yaml)
    - matches:
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: Exact
            value: /docs-json
      filters:
        - type: ExtensionRef
          extensionRef:
            group: apisix.apache.org
            kind: PluginConfig
            name: swagger-basic-auth
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    # Everything else (the API itself): no basic auth
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
