apiVersion: apps/v1
kind: Deployment
metadata:
  name: epsi-pay-auth
  namespace: applications
  labels:
    app: epsi-pay-auth
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # old pod stays until the new one is Ready
  selector:
    matchLabels:
      app: epsi-pay-auth
  template:
    metadata:
      labels:
        app: epsi-pay-auth
    spec:
      serviceAccountName: seed-waiter
      imagePullSecrets:
        - name: ghcr-credentials
      initContainers:
        - name: wait-for-seed
          image: registry.k8s.io/kubectl:v1.35.4
          command: [kubectl, wait, --for=condition=complete, job/epsi-pay-database-seed, --timeout=600s]
        # Tracing without touching the app: copies the OpenTelemetry Node auto-instrumentation
        # (http, express, nestjs-core...) into a shared volume, loaded through NODE_OPTIONS below.
        # Spans go to Tempo (kubernetes/logging/tempo-values.yml) and join APISIX's (B3 headers).
        - name: otel-autoinstrumentation
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.77.0
          command: [cp, -r, /autoinstrumentation/., /otel-auto-instrumentation/]
          volumeMounts:
            - {name: otel-auto-instrumentation, mountPath: /otel-auto-instrumentation}
      containers:
        - name: auth
          image: ghcr.io/resilience-alpha/epsi-pay-auth:latest   # tag replaced by kustomize
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: host}}
            - name: DB_PORT
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: port}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: database}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: password}}
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            # Biometric login (WebAuthn). RP ID is the host serving the SPA, with no scheme or
            # port: a credential registered here is unusable on any other domain, which is what
            # makes phishing ineffective. Scoped to app. rather than the apex on purpose, so the
            # sibling admin subdomains (grafana, vault-ui, jaeger...) cannot use EPSI Pay keys.
            # ORIGINS is the full origin the browser reports; the SPA calls its own origin.
            - name: WEBAUTHN_RP_ID
              value: app.karim-portfolio.xyz
            - name: WEBAUTHN_RP_NAME
              value: EPSI Pay
            - name: WEBAUTHN_ORIGINS
              value: https://app.karim-portfolio.xyz
            - name: NODE_OPTIONS
              value: --require /otel-auto-instrumentation/autoinstrumentation.js
            - name: OTEL_SERVICE_NAME
              value: epsi-pay-auth
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.admin.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER   # Tempo only takes traces
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            # b3multi: APISIX's zipkin plugin sends X-B3-* headers
            - name: OTEL_PROPAGATORS
              value: tracecontext,baggage,b3multi
            # No cloud detectors (they probe metadata endpoints at startup)
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: env,host,os,process,serviceinstance,container
            - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS   # noise: one span per file/dns/socket call
              value: fs,dns,net
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=prod,k8s.namespace.name=applications
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /health, port: 3000}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 3000}
            initialDelaySeconds: 30         # Nest + OTel auto-instrumentation start slowly
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - {name: otel-auto-instrumentation, mountPath: /otel-auto-instrumentation, readOnly: true}
      volumes:
        - name: otel-auto-instrumentation
          emptyDir: {sizeLimit: 300Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: epsi-pay-auth
  namespace: applications
spec:
  type: ClusterIP
  selector:
    app: epsi-pay-auth
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: epsi-pay-auth-route
  namespace: applications
spec:
  parentRefs:
    - name: main-gateway
      namespace: apisix
  hostnames:
    - auth.karim-portfolio.xyz
  rules:
    # Swagger UI and its OpenAPI JSON: basic auth (swagger-basic-auth.yaml)
    - matches:
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: Exact
            value: /docs-json
      filters:
        - type: ExtensionRef
          extensionRef:
            group: apisix.apache.org
            kind: PluginConfig
            name: swagger-basic-auth
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    # Everything else (the API itself): no basic auth
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
