# One-shot seed of the epsi_pay database: prisma db push, then the seed-10k script.
# Synced by its own Argo CD app (gitops/apps/epsi-pay-seed.yaml), which never compares or changes
# the spec of an existing Job: it only creates the Job when it does not exist (fresh cluster).
#
# DANGER: never re-run it on a database with real data. seed-10k skips only when the database holds
# 5000 or more login attempts; below that it DELETES the existing rows and reseeds.
# Re-running on purpose (fresh or test database only):
#   kubectl -n applications delete job epsi-pay-database-seed, then sync epsi-pay-seed.
#
# The Job running in the cluster was created before this repository with the old Secret name
# postgres-authentication-credentials; Git uses postgres-epsi-pay-credentials for new clusters.
apiVersion: batch/v1
kind: Job
metadata:
  name: epsi-pay-database-seed
  namespace: applications
  annotations:
    # Never deleted by Argo CD (prune or app deletion): re-creating the Job re-runs the seed.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app: epsi-pay-database
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: epsi-pay-database
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: database-seed
          image: ghcr.io/resilience-alpha/epsi-pay-database:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: host}}
            - name: DB_PORT
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: port}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: database}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-epsi-pay-credentials, key: password}}
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
