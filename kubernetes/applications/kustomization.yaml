# EPSI Pay applications, synced by Argo CD (gitops/apps/epsi-pay.yaml).
# Postgres has its own app (postgres/), synced first. The seed Job has its own app (seed/).
# database-migrate.yaml: PreSync hook, applies the Prisma migrations before each sync.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ghcr-credentials.yaml
  - database-migrate.yaml
  - seed-waiter.yaml
  - auth.yaml
  - payment.yaml
  - swagger-basic-auth.yaml
  - front.yaml
  - pgadmin.yaml
  - network-policies.yaml
images:
  # Same epsi_pay commit as auth and payment: its migrations match their code.
  - name: ghcr.io/resilience-alpha/epsi-pay-database
    newTag: "REPLACE_WITH_CI_TAG"
  - name: ghcr.io/resilience-alpha/epsi-pay-auth
    newTag: "20261116.10"
  - name: ghcr.io/resilience-alpha/epsi-pay-payment
    newTag: "20261116.10"
  - name: ghcr.io/resilience-alpha/epsi-pay-front
    newTag: "20261116.11"
