apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-epsi-pay-credentials
  namespace: applications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-epsi-pay-credentials
  data:
    - secretKey: username
      remoteRef:
        key: postgres-epsi-pay      # Vault: apps/postgres-epsi-pay
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-epsi-pay      # Vault: apps/postgres-epsi-pay
        property: password
    - secretKey: database
      remoteRef:
        key: postgres-epsi-pay      # Vault: apps/postgres-epsi-pay
        property: database
    - secretKey: host
      remoteRef:
        key: postgres-epsi-pay      # Vault: apps/postgres-epsi-pay
        property: host
    - secretKey: port
      remoteRef:
        key: postgres-epsi-pay      # Vault: apps/postgres-epsi-pay
        property: port
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: applications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
  data:
    - secretKey: password
      remoteRef:
        key: postgres      # Vault: apps/postgres
        property: password
