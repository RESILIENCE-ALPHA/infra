apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-authentication-credentials
  namespace: applications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-authentication-credentials
  data:
    - secretKey: username
      remoteRef:
        key: postgres-authentication      # Vault: apps/postgres-authentication
        property: username
    - secretKey: password
      remoteRef:
        key: postgres-authentication      # Vault: apps/postgres-authentication
        property: password
    - secretKey: database
      remoteRef:
        key: postgres-authentication      # Vault: apps/postgres-authentication
        property: database
    - secretKey: host
      remoteRef:
        key: postgres-authentication      # Vault: apps/postgres-authentication
        property: host
    - secretKey: port
      remoteRef:
        key: postgres-authentication      # Vault: apps/postgres-authentication
        property: port
---
