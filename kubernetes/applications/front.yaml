# EPSI Pay front (Vite SPA served by nginx on 8080). The SPA calls its own origin under /api
# (CSP connect-src 'self'); APISIX routes those calls to auth / payment itself (rules below), so the
# image's nginx /api relay (API_UPSTREAM) is unused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epsi-pay-front
  namespace: applications
  labels:
    app: epsi-pay-front
  annotations:
    argocd.argoproj.io/sync-wave: "1"    # after auth/payment (wave 0)
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # old pod stays until the new one is Ready
  selector:
    matchLabels:
      app: epsi-pay-front
  template:
    metadata:
      labels:
        app: epsi-pay-front
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: front
          image: ghcr.io/resilience-alpha/epsi-pay-front:latest   # tag replaced by kustomize
          imagePullPolicy: IfNotPresent
          env:
            # The default (127.0.0.11) is Docker's DNS; nginx's `resolver` needs the cluster DNS here
            - name: NGINX_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: epsi-pay-front
  namespace: applications
spec:
  type: ClusterIP
  selector:
    app: epsi-pay-front
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: epsi-pay-front-route
  namespace: applications
spec:
  parentRefs:
    - name: main-gateway
      namespace: apisix
  hostnames:
    - app.karim-portfolio.xyz
  rules:
    # /api/auth/{signup,login,logout,me} -> auth /signup, /login etc. Exact paths, so
    # /api/auth/docs never reaches Swagger without basic auth.
    # signup is the only unauthenticated endpoint that writes (user + wallet + audit row), so it
    # carries its own per-IP quota (PluginConfig/signup-ratelimit at the end of this file).
    - matches:
        - path: {type: Exact, value: /api/auth/signup}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /signup}
        - type: ExtensionRef
          extensionRef:
            group: apisix.apache.org
            kind: PluginConfig
            name: signup-ratelimit
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    - matches:
        - path: {type: Exact, value: /api/auth/login}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /login}
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    - matches:
        - path: {type: Exact, value: /api/auth/logout}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /logout}
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    - matches:
        - path: {type: Exact, value: /api/auth/me}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /me}
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    # Biometric login (WebAuthn: face / fingerprint) -> auth /passkeys/*
    # One prefix rule rather than exact paths, because POST /passkeys/{id}/revoke carries a dynamic
    # segment. Still scoped to /passkeys, so it cannot reach /docs without basic auth either.
    # Covers: login/options, login/verify, register/options, register/verify, the list (GET
    # /passkeys) and {id}/revoke. Nothing biometric crosses this route: only public keys and
    # signatures.
    - matches:
        - path: {type: PathPrefix, value: /api/auth/passkeys}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /passkeys}
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    # /api/payments*, /api/wallets* -> payment
    - matches:
        - path: {type: PathPrefix, value: /api/payments}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /payments}
      backendRefs:
        - name: epsi-pay-payment
          port: 3000
    # TEMPORARY: the front expects GET /wallets as {"wallets": [...]} but payment returns a bare
    # array, so the dashboard loads forever. PluginConfig/wallets-list-wrap fixes the shape;
    # remove this rule and that PluginConfig once the app is fixed.
    - matches:
        - path: {type: Exact, value: /api/wallets}
      filters:
        # No URLRewrite here: the PluginConfig's proxy-rewrite also does /api/wallets -> /wallets
        - type: ExtensionRef
          extensionRef:
            group: apisix.apache.org
            kind: PluginConfig
            name: wallets-list-wrap
      backendRefs:
        - name: epsi-pay-payment
          port: 3000
    - matches:
        - path: {type: PathPrefix, value: /api/wallets}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /wallets}
      backendRefs:
        - name: epsi-pay-payment
          port: 3000
    # Everything else: the SPA
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: epsi-pay-front
          port: 8080
---
# Per-IP quota on account creation (see the /api/auth/signup rule above). 10 accounts per hour is
# far above real use and well below what makes mass signup worthwhile.
#
# policy: local keeps the counter in an nginx shared memory zone (lua_shared_dict
# plugin-limit-count), which every worker process in a pod reads and writes, so workers do NOT each
# get their own quota and no Redis is needed. The boundary is the pod, not the worker: at the
# current single data plane replica the effective limit is exactly 10/h, but with N replicas each
# keeps its own counter and the ceiling becomes 10*N -- connections are not pinned to a pod, so a
# caller can spend a fresh budget on each one. Switch policy to redis, against a shared Redis, if
# the data plane is ever scaled out.
#
# Two limits that apply even at one replica:
#   - the counter is in shared memory, so a pod restart or an Argo CD rollout resets it to zero.
#   - key: remote_addr is the true client IP only because externalTrafficPolicy: Local preserves it
#     and APISIX trusts no proxy for X-Real-IP (set_real_ip_from is loopback only). Adding a CDN or
#     another proxy in front without listing it in set_real_ip_from would make remote_addr the proxy
#     address, collapsing this into one global 10/h bucket that locks out legitimate signups.
apiVersion: apisix.apache.org/v1alpha1
kind: PluginConfig
metadata:
  name: signup-ratelimit
  namespace: applications
spec:
  plugins:
    - name: limit-count
      config:
        count: 10
        time_window: 3600
        key_type: var
        key: remote_addr
        policy: local
        rejected_code: 429
---
# TEMPORARY (see the /api/wallets rule above): wraps the bare array returned by payment's GET /wallets
# into {"wallets": [...]}. If-None-Match / ETag are dropped so browsers never reuse a cached bare
# array through a 304.
apiVersion: apisix.apache.org/v1alpha1
kind: PluginConfig
metadata:
  name: wallets-list-wrap
  namespace: applications
spec:
  plugins:
    - name: proxy-rewrite
      config:
        uri: /wallets
        headers:
          remove: [If-None-Match]
    - name: response-rewrite
      config:
        vars: [[status, "==", 200]]
        headers:
          remove: [ETag]
        filters:
          - {regex: '^\s*\[', replace: '{"wallets":[', scope: once}
          - {regex: '\]\s*$', replace: ']}', scope: once}
