# EPSI Pay front (Vite SPA served by nginx on 8080). The SPA calls its own origin under /api
# (CSP connect-src 'self'); APISIX routes those calls to auth / payment itself (rules below), so the
# image's nginx /api relay (API_UPSTREAM) is unused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epsi-pay-front
  namespace: applications
  labels:
    app: epsi-pay-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epsi-pay-front
  template:
    metadata:
      labels:
        app: epsi-pay-front
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: front
          image: ghcr.io/resilience-alpha/epsi-pay-front:latest
          imagePullPolicy: Always
          env:
            # The default (127.0.0.11) is Docker's DNS; nginx's `resolver` needs the cluster DNS here
            - name: NGINX_RESOLVER
              value: kube-dns.kube-system.svc.cluster.local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: epsi-pay-front
  namespace: applications
spec:
  type: ClusterIP
  selector:
    app: epsi-pay-front
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: epsi-pay-front-route
  namespace: applications
spec:
  parentRefs:
    - name: main-gateway
      namespace: apisix
  hostnames:
    - app.karim-portfolio.xyz
  rules:
    # /api/auth/{login,logout,me} -> auth /login etc. Exact paths, so /api/auth/docs never
    # reaches Swagger without basic auth.
    - matches:
        - path: {type: Exact, value: /api/auth/login}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /login}
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    - matches:
        - path: {type: Exact, value: /api/auth/logout}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /logout}
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    - matches:
        - path: {type: Exact, value: /api/auth/me}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /me}
      backendRefs:
        - name: epsi-pay-auth
          port: 3000
    # /api/payments*, /api/wallets* -> payment
    - matches:
        - path: {type: PathPrefix, value: /api/payments}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /payments}
      backendRefs:
        - name: epsi-pay-payment
          port: 3000
    # TEMPORARY: the front expects GET /wallets as {"wallets": [...]} but payment returns a bare
    # array, so the dashboard loads forever. PluginConfig/wallets-list-wrap fixes the shape;
    # remove this rule and that PluginConfig once the app is fixed.
    - matches:
        - path: {type: Exact, value: /api/wallets}
      filters:
        # No URLRewrite here: the PluginConfig's proxy-rewrite also does /api/wallets -> /wallets
        - type: ExtensionRef
          extensionRef:
            group: apisix.apache.org
            kind: PluginConfig
            name: wallets-list-wrap
      backendRefs:
        - name: epsi-pay-payment
          port: 3000
    - matches:
        - path: {type: PathPrefix, value: /api/wallets}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /wallets}
      backendRefs:
        - name: epsi-pay-payment
          port: 3000
    # Everything else: the SPA
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: epsi-pay-front
          port: 8080
---
# TEMPORARY (see the /api/wallets rule above): wraps the bare array returned by payment's GET /wallets
# into {"wallets": [...]}. If-None-Match / ETag are dropped so browsers never reuse a cached bare
# array through a 304.
apiVersion: apisix.apache.org/v1alpha1
kind: PluginConfig
metadata:
  name: wallets-list-wrap
  namespace: applications
spec:
  plugins:
    - name: proxy-rewrite
      config:
        uri: /wallets
        headers:
          remove: [If-None-Match]
    - name: response-rewrite
      config:
        vars: [[status, "==", 200]]
        headers:
          remove: [ETag]
        filters:
          - {regex: '^\s*\[', replace: '{"wallets":[', scope: once}
          - {regex: '\]\s*$', replace: ']}', scope: once}
