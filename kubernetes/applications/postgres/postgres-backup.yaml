# Nightly backup of the whole Postgres server (pg_dumpall), gzipped, uploaded to RustFS
# (backup namespace, on apps-node), kept 90 days. Restore: docs/runbooks/backups-restore.md.
#
# Not encrypted (decision of 2026-11-11): the dumps sit in clear on the laptop disk, which is not
# encrypted either. To turn age encryption on later, set AGE_RECIPIENT (an age1... public key),
# e.g. from Vault apps/backup through this ExternalSecret: the script then writes .sql.gz.age.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-target
  namespace: applications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backup-target
  data:
    - secretKey: RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID
      remoteRef:
        key: backup      # Vault: apps/backup
        property: rustfs_access_key
    - secretKey: RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY
      remoteRef:
        key: backup      # Vault: apps/backup
        property: rustfs_secret_key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-script
  namespace: applications
data:
  backup.sh: |
    #!/bin/sh
    # Dump -> check -> gzip [-> age] -> upload -> verify -> prune older than RETENTION.
    set -eu
    apk add --no-cache rclone >/dev/null
    export RCLONE_CONFIG=/dev/null        # remotes come from RCLONE_CONFIG_RUSTFS_* variables

    stamp=$(date -u +%Y-%m-%dT%H%M%SZ)
    work=/work
    dump="$work/pg-$stamp.sql"
    dest="rustfs:$BUCKET/postgres"

    recipient=${AGE_RECIPIENT:-}
    case "$recipient" in
      "") out="$dump.gz" ;;
      age1*) apk add --no-cache age >/dev/null; out="$dump.gz.age" ;;
      *) echo "AGE_RECIPIENT is not an age public key (age1...): refusing"; exit 1 ;;
    esac

    echo "dumping $PGHOST"
    pg_dumpall --clean --if-exists > "$dump"
    tail -n 3 "$dump" | grep -q "PostgreSQL database cluster dump complete" \
      || { echo "dump incomplete"; exit 1; }
    echo "dump: $(du -h "$dump" | cut -f1)"

    if [ -n "$recipient" ]; then
      gzip -c "$dump" | age -r "$recipient" > "$out"
    else
      gzip -c "$dump" > "$out"
    fi
    rm -f "$dump"

    rclone mkdir -q "rustfs:$BUCKET"
    rclone copy -q "$out" "$dest/"
    remote_size=$(rclone size -q --json "$dest/$(basename "$out")" | sed -n 's/.*"bytes":\([0-9]*\).*/\1/p')
    local_size=$(stat -c %s "$out")
    [ "$remote_size" = "$local_size" ] || { echo "upload size mismatch: $remote_size != $local_size"; exit 1; }
    echo "uploaded $(basename "$out") ($local_size bytes)"

    rclone delete -q --min-age "$RETENTION" "$dest/"
    echo "kept: $(rclone lsf -q "$dest/" | wc -l) backups"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: applications
spec:
  schedule: "30 2 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3                   # retries if the laptop (RustFS) is briefly unreachable
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              # Same major version as the server (postgres:16), so pg_dumpall matches.
              image: postgres:16-alpine
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - name: PGHOST
                  value: postgres.applications.svc.cluster.local
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                - name: BUCKET
                  value: backups
                - name: RETENTION
                  value: 90d
                - name: RCLONE_CONFIG_RUSTFS_TYPE
                  value: s3
                - name: RCLONE_CONFIG_RUSTFS_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_RUSTFS_ENDPOINT
                  value: http://rustfs.backup.svc.cluster.local:9000
                - name: RCLONE_CONFIG_RUSTFS_FORCE_PATH_STYLE
                  value: "true"
              envFrom:
                - secretRef:
                    name: backup-target
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: work
                  mountPath: /work
          volumes:
            - name: scripts
              configMap:
                name: postgres-backup-script
            - name: work
              emptyDir:
                sizeLimit: 2Gi
