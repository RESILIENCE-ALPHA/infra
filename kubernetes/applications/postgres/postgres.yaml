# Single Postgres server (database epsi_pay), synced by Argo CD (gitops/apps/postgres.yaml).
# Superuser password: Secret postgres-credentials (key: password, ExternalSecret <- Vault apps/postgres).
# epsi_pay role + database, password from Secret postgres-epsi-pay-credentials (key: password).
# The init script only runs on an empty data directory (first start); for an existing server,
# create a new database and role by hand, then add them here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: applications
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d postgres \
      -c "CREATE ROLE epsi_pay LOGIN PASSWORD '${DB_PASSWORD_EPSI_PAY}'" \
      -c "CREATE DATABASE epsi_pay OWNER epsi_pay"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: applications
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false   # Argo CD never prunes or deletes the database
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: applications
  labels:
    app: postgres
    environment: "prod"
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        environment: "prod"
    spec:
      containers:
        - name: postgres
          image: "postgres:16"
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DB_PASSWORD_EPSI_PAY
              valueFrom:
                secretKeyRef:
                  name: postgres-epsi-pay-credentials
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: applications
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
