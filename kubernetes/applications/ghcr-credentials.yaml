# Pull secret for the private GHCR images (ghcr.io/resilience-alpha/*), from Vault
# apps/ghcr-credentials (username, token). Replaces the sed-rendered security/ghcr-auth.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-credentials
  namespace: applications
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "https://ghcr.io": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: ghcr-credentials
        property: username
    - secretKey: token
      remoteRef:
        key: ghcr-credentials
        property: token
