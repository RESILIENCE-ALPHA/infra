persistence:
   enabled: true
   size: 10Gi
   
admin:
   existingSecret: grafana-admin   # created out of band, not stored in git
   userKey: admin-user
   passwordKey: admin-password
   
service:
   type: ClusterIP # Use ClusterIP if you plan to use an Ingress (like Traefik)

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.logging.svc.cluster.local
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki-gateway.logging.svc.cluster.local

initChownData:
  enabled: false

# Dashboards are loaded from ConfigMaps labelled grafana_dashboard=1 (see deploy_infra.sh).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
