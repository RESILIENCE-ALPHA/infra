persistence:
   enabled: true
   size: 10Gi
   annotations:
      argocd.argoproj.io/sync-options: Delete=false   # Argo CD never deletes Grafana's data
   
admin:
   existingSecret: grafana-admin   # created out of band, not stored in git
   userKey: admin-user
   passwordKey: admin-password
   
service:
   type: ClusterIP # Use ClusterIP if you plan to use an Ingress (like Traefik)

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.logging.svc.cluster.local
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki-gateway.logging.svc.cluster.local
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger.logging.svc.cluster.local:16686

initChownData:
  enabled: false

# Dashboards are loaded from ConfigMaps labelled grafana_dashboard=1 (kubernetes/logging/kustomization.yaml).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
