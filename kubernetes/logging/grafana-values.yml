persistence:
  enabled: true
  size: 10Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false   # Argo CD never prunes or deletes Grafana's data
  # Bound to the existing volume (kept when moving from the logging namespace). Declared here so
  # the rendered claim matches the live one: a bound claim's spec is immutable.
  storageClassName: local-path
  volumeName: pvc-b941e868-7320-4953-a033-f0aaf7330dda

admin:
  existingSecret: grafana-admin   # created out of band, not stored in git
  userKey: admin-user
  passwordKey: admin-password

service:
  type: ClusterIP # Use ClusterIP if you plan to use an Ingress (like Traefik)

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: PBFA97CFB590B2093   # existing ID: Grafana cannot change the uid of a data source it already has
        url: http://prometheus-server.admin.svc.cluster.local
        isDefault: true
      - name: Loki
        type: loki
        uid: P8E80F9AEF21F6940   # existing ID (see above)
        url: http://loki-gateway.admin.svc.cluster.local
      # Traces (kubernetes/logging/tempo-values.yml). Service graph and span metrics come from
      # Tempo's metrics generator, stored in Prometheus.
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.admin.svc.cluster.local:3200
        jsonData:
          serviceMap:
            datasourceUid: PBFA97CFB590B2093   # Prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: P8E80F9AEF21F6940   # Loki
          # "Logs for this span": same app and namespace in Loki, around the span's time.
          tracesToLogsV2:
            datasourceUid: P8E80F9AEF21F6940   # Loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: false
            tags:
              - {key: service.name, value: app}
              - {key: k8s.namespace.name, value: namespace}

initChownData:
  enabled: false

# Dashboards are loaded from ConfigMaps labelled grafana_dashboard=1 (kubernetes/logging/kustomization.yaml).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
