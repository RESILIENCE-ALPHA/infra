persistence:
  enabled: true
  size: 10Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false   # Argo CD never prunes or deletes Grafana's data
  # Bound to the existing volume (kept when moving from the logging namespace). Declared here so
  # the rendered claim matches the live one: a bound claim's spec is immutable.
  storageClassName: local-path
  volumeName: pvc-b941e868-7320-4953-a033-f0aaf7330dda

admin:
  existingSecret: grafana-admin   # created out of band, not stored in git
  userKey: admin-user
  passwordKey: admin-password

service:
  type: ClusterIP # Use ClusterIP if you plan to use an Ingress (like Traefik)

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.admin.svc.cluster.local
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki-gateway.admin.svc.cluster.local
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger.admin.svc.cluster.local:16686

initChownData:
  enabled: false

# Dashboards are loaded from ConfigMaps labelled grafana_dashboard=1 (kubernetes/logging/kustomization.yaml).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
