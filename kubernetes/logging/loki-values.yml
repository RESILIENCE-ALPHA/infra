# kubernetes/logging/loki-values.yml
deploymentMode: SingleBinary
loki:
    auth_enabled: false
    commonConfig:
        replication_factor: 1
    storage:
        type: filesystem
    schemaConfig:
        configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                  prefix: index_
                  period: 24h
singleBinary:
    replicas: 1
    persistence:
        enabled: true
        size: 10Gi
    # Admin tools run on admin-node (labelled and tainted node-role/admin=true by Ansible).
    nodeSelector:
        node-role/admin: "true"
    tolerations:
        - key: node-role/admin
          operator: Equal
          value: "true"
          effect: NoSchedule
# loki-gateway (nginx in front of Loki): next to Loki. The memcached caches stay where they are.
gateway:
    nodeSelector:
        node-role/admin: "true"
    tolerations:
        - key: node-role/admin
          operator: Equal
          value: "true"
          effect: NoSchedule
read:
    replicas: 0
write:
    replicas: 0
backend:
    replicas: 0
