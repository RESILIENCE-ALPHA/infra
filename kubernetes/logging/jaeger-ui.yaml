# Public Jaeger UI (jaeger.karim-portfolio.xyz) behind HTTP basic auth: Jaeger has no login of its own.
# Credentials come from Vault (apps/jaeger-basic-auth: username, password) via the ExternalSecret
# below, which creates Secret `jaeger-basic-auth`. Nothing secret in git.
# basic-auth alone would accept any APISIX consumer (e.g. the Swagger one), so consumer-restriction
# only lets this consumer in. APISIX names it `<namespace>_<name>` (logging_jaeger-user).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jaeger-basic-auth
  namespace: logging
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jaeger-basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: jaeger-basic-auth   # Vault: apps/jaeger-basic-auth
        property: username
    - secretKey: password
      remoteRef:
        key: jaeger-basic-auth
        property: password
---
apiVersion: apisix.apache.org/v1alpha1
kind: Consumer
metadata:
  name: jaeger-user
  namespace: logging
spec:
  gatewayRef:
    name: main-gateway
    namespace: apisix
  credentials:
    - type: basic-auth
      name: jaeger-basic-auth
      secretRef:
        name: jaeger-basic-auth
---
apiVersion: apisix.apache.org/v1alpha1
kind: PluginConfig
metadata:
  name: jaeger-basic-auth
  namespace: logging
spec:
  plugins:
    - name: basic-auth
      config:
        hide_credentials: true   # Jaeger does not need the Authorization header
    - name: consumer-restriction
      config:
        type: consumer_name
        whitelist: [logging_jaeger-user]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger-route
  namespace: logging
spec:
  parentRefs:
    - name: main-gateway
      namespace: apisix
  hostnames:
    - jaeger.karim-portfolio.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: apisix.apache.org
            kind: PluginConfig
            name: jaeger-basic-auth
      backendRefs:
        - name: jaeger
          port: 16686
