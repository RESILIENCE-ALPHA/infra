# Discord webhook for Alertmanager, from Vault apps/alerting (property discord_webhook).
# Mounted as a file in Alertmanager (prometheus-values.yml, webhook_url_file): never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: admin
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-discord
  data:
    - secretKey: webhook-url
      remoteRef:
        key: alerting          # Vault: apps/alerting
        property: discord_webhook
