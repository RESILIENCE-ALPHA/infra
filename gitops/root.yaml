# Root "app of apps": Argo CD watches gitops/apps/ on main and creates one Application
# per file there. Applied once by ansible/playbooks/argocd.yml; everything else comes from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true      # removing a file from gitops/apps removes its Application
      selfHeal: true
