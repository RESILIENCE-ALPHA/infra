# Argo CD, chart argo/argo-cd 10.10.5 (Argo CD v3.5.5), installed by ansible/playbooks/argocd.yml.
# Single-node-sized: no HA, no Dex (local admin only for now), no notifications controller.
global:
  domain: argocd.karim-portfolio.xyz
  # Keep Argo CD on the control plane (apps-node is tainted anyway, this makes it explicit).
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"

configs:
  params:
    # TLS will end at the APISIX gateway once argocd.karim-portfolio.xyz gets a route.
    server.insecure: true
    # Diff against a server-side dry-run apply, so defaults that the API server or a CRD
    # adds (ExternalSecret remoteRef fields, HTTPRoute group/kind...) never show as drift.
    controller.diff.server.side: "true"
  cm:
    admin.enabled: true
    exec.enabled: false
    # Track resources with an annotation, so adopted Helm releases keep their own labels.
    application.resourceTrackingMethod: annotation
    # Health of child Applications, so root waits for each sync wave to be Healthy before the
    # next (operators and CRDs before the apps that use them). Not built in since Argo CD 1.8.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

dex:
  enabled: false

notifications:
  enabled: false

controller:
  # Metrics service (argocd_app_info...), scraped by Prometheus through its annotations.
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

server:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

applicationSet:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}

redis:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 192Mi}
