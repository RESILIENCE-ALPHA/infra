# Vault (secrets source of truth), file storage on PVC data-vault-0, Shamir-sealed.
# Its StatefulSet uses updateStrategy OnDelete: a sync never restarts vault-0 (which would
# leave it sealed). After a chart upgrade, delete vault-0 yourself and unseal it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.34.1
      helm:
        releaseName: vault
        valueFiles:
          - $values/kubernetes/security/vault-values.yaml
    - repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  # The agent injector fills in its webhook CA at runtime; the chart renders it empty.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
