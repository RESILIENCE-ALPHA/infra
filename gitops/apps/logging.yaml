# Plain observability manifests in the admin namespace (kubernetes/logging/kustomization.yaml):
# Jaeger, Jaeger UI route + basic auth, Grafana route, Grafana admin ExternalSecret,
# Grafana dashboards (ConfigMaps generated from kubernetes/logging/dashboards/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
    targetRevision: main
    path: kubernetes/logging
  destination:
    server: https://kubernetes.default.svc
    namespace: admin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
