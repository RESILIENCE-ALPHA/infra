# Plain manifests of the logging namespace (kubernetes/logging/kustomization.yaml):
# Jaeger, Jaeger UI route + basic auth, Grafana route, Grafana admin ExternalSecret,
# Grafana dashboards (ConfigMaps generated from kubernetes/logging/dashboards/).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
    targetRevision: main
    path: kubernetes/logging
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    # Automated sync paused while moving to the admin namespace (docs/runbooks/move-to-admin-namespace.md).
    syncOptions:
      - ServerSideApply=true
