# Tailscale Kubernetes operator (chart tailscale-operator 1.104.4) + its OAuth ExternalSecret.
# It turns Ingresses of class "tailscale" into tailnet-only HTTPS endpoints
# (https://<name>.<tailnet>.ts.net). Runbook: docs/runbooks/tailnet-admin.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.104.4
      helm:
        releaseName: tailscale-operator
        valuesObject:
          # OAuth client from the ExternalSecret below (keys client_id, client_secret).
          oauthSecretVolume:
            secret:
              secretName: operator-oauth
          operatorConfig:
            hostname: k8s-operator
            nodeSelector:
              node-role.kubernetes.io/control-plane: "true"
            resources:
              requests: {cpu: 20m, memory: 64Mi}
              limits: {memory: 256Mi}
          proxyConfig:
            defaultTags: "tag:k8s"
            defaultProxyClass: vps          # kubernetes/tailscale/access/proxyclass.yaml
          apiServerProxyConfig:
            mode: "false"
    - repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
      targetRevision: main
      path: kubernetes/tailscale/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
