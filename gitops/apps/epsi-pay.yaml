# EPSI Pay: auth, payment, front, pgAdmin, Swagger basic auth, GHCR pull secret.
# The database seed Job is in its own app (epsi-pay-seed.yaml).
# Wave 2: after Postgres.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: epsi-pay
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
    targetRevision: main
    path: kubernetes/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: applications
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
