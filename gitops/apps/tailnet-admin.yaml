# Tailnet-only access to the admin tools: ProxyClass + one tailscale Ingress per tool
# (kubernetes/tailscale/access). Wave 1: after the operator, which installs the CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailnet-admin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
    targetRevision: main
    path: kubernetes/tailscale/access
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
