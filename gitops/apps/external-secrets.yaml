# External Secrets Operator (namespace security, next to Vault): syncs Vault apps/* into Secrets.
# Installs its CRDs.
# Wave -3: CRDs and webhook must exist before any ExternalSecret / ClusterSecretStore.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.4.1
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/kubernetes/security/external-secrets-values.yaml
    - repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: security
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
