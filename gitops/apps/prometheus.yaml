# Prometheus (metrics) + node-exporter + kube-state-metrics, 10Gi PVC prometheus-server.
# Adopts the release from deploy_infra.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.38.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/kubernetes/logging/prometheus-values.yml
    - repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: admin
  # The claim is bound to a pre-existing volume (moved from the logging namespace), so it
  # carries volumeName/storageClassName that the chart does not render. Keep the live values
  # instead of trying to clear them (a bound claim's spec is immutable).
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
        - /spec/storageClassName
  syncPolicy:
    # Automated sync paused while moving to the admin namespace (docs/runbooks/move-to-admin-namespace.md).
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
