# Grafana, 10Gi PVC. Admin login from Vault via ExternalSecret grafana-admin (logging app, admin namespace).
# Adopts the release from deploy_infra.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15
      helm:
        releaseName: grafana
        valueFiles:
          - $values/kubernetes/logging/grafana-values.yml
    - repoURL: https://github.com/RESILIENCE-ALPHA/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: admin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
